[package]
name = "mandor-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Adapter API mandord: server JSON-RPC lewat WebSocket lokal dan relay stdio."

[dependencies]
mandor-protocol.workspace = true
axum = { workspace = true, features = ["ws", "tokio", "http1"] }
tokio = { workspace = true, features = ["net", "io-util", "io-std", "sync", "time", "rt", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
secrecy.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
