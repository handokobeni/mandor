# Cermin mesin dari daftar terlarang rust-engineering (libraries.md) + aturan lapisan mandor.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # SQLite < 3.54 lewat libsqlite3-sys 0.37 (sqlx-sqlite 0.9.0, versi sqlx
    # terbaru, belum bisa naik). Hanya terpicu bila proses membuka database
    # beserta berkas -wal yang ditulis pihak kurang tepercaya; mandord hanya
    # membuka ~/.mandor/mandor.db milik user sendiri. Disetujui pemilik produk
    # 2026-11-10. Hapus saat sqlx memakai libsqlite3-sys >= 0.39.
    { id = "RUSTSEC-2026-0459", reason = "local-only; daemon opens only its own ~/.mandor database; blocked on sqlx upgrade" },
]

[licenses]
version = 2
private = { ignore = true }
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "actix-web", reason = "use axum + tower" },
  { crate = "rocket", reason = "use axum + tower" },
  { crate = "poem", reason = "use axum + tower" },
  { crate = "warp", reason = "use axum + tower" },
  { crate = "salvo", reason = "use axum + tower" },
  { crate = "async-std", reason = "tokio is the only runtime" },
  { crate = "smol", reason = "tokio is the only runtime" },
  { crate = "diesel", reason = "use sqlx raw SQL" },
  { crate = "sea-orm", reason = "use sqlx raw SQL" },
  { crate = "rusqlite", reason = "use sqlx (KTD-3)" },
  { crate = "config", reason = "use std::env + Config::from_env" },
  { crate = "figment", reason = "use std::env + Config::from_env" },
  { crate = "env_logger", reason = "use tracing" },
  { crate = "log4rs", reason = "use tracing" },
  { crate = "simplelog", reason = "use tracing" },
  { crate = "slog", reason = "use tracing" },
  { crate = "shaku", reason = "wire by hand in main.rs" },
  { crate = "openssl", reason = "use rustls" },
  { crate = "native-tls", reason = "use rustls" },
  { crate = "failure", reason = "use thiserror / anyhow" },
  { crate = "error-chain", reason = "use thiserror / anyhow" },

  # Lapisan (CLAUDE.md): crate infrastruktur hanya boleh dipakai adapternya.
  { crate = "sqlx", wrappers = ["mandor-store", "mandord"], reason = "only the store adapter may use sqlx" },
  { crate = "axum", wrappers = ["mandor-api", "mandord"], reason = "only the api adapter may use axum" },
  { crate = "reqwest", wrappers = ["mandor-lark", "mandord"], reason = "only the lark adapter may call HTTP" },
  { crate = "anyhow", wrappers = ["mandord"], reason = "library crates return typed thiserror enums" },
]
