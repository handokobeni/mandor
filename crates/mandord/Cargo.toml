[package]
name = "mandord"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Daemon mandor: main, konfigurasi, wiring manual, subcommand connect dan hook."

[[bin]]
name = "mandord"
path = "src/main.rs"

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
mandor-domain.workspace = true
mandor-usecase.workspace = true
mandor-proc.workspace = true
mandor-store.workspace = true
mandor-protocol.workspace = true
mandor-api.workspace = true
mandor-agent.workspace = true
mandor-git.workspace = true
mandor-lark.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2 = { version = "0.11", default-features = false }
hyper = { version = "1", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = { version = "0.1", default-features = false }
fd-lock.workspace = true
rand = { workspace = true, features = ["std", "thread_rng"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "json", "env-filter", "std"] }
process-wrap = { workspace = true, features = ["tokio1", "process-session", "kill-on-drop"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
