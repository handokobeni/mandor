name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]   # dokumen tidak di-build atau di-test
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  schedule:
    - cron: "17 2 * * *"   # advisories harian (Linux)
    - cron: "37 3 * * 1"   # matrix penuh mingguan
  workflow_dispatch:       # matrix penuh manual dari tab Actions

# Repo private: macOS (10x) dan Windows (2x) menghabiskan kuota menit, jadi push dan PR
# hanya Linux; macOS dan Windows berjalan mingguan dan saat dipicu manual.

jobs:
  rust:
    name: make check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '37 3 * * 1') && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-llvm-cov,sqlx-cli
      # Drive C: runner Windows lambat; database SQLite test di sana melewati
      # batas acquire 5 detik. Direktori sementara dipindah ke D:.
      - name: "Direktori sementara di D:"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Batas coverage berlaku di Linux dan macOS, tempat daemon berjalan. Di Windows
      # test adapter git/gh/proses (skrip shell palsu) hanya untuk Unix, jadi gerbang
      # dijalankan tanpa batas coverage; fmt, clippy, deny, sqlx, dan semua test tetap.
      - name: make check
        shell: bash
        env:
          COVER_FLOOR: ${{ runner.os == 'Windows' && 'COVER_MIN=0' || '' }}
        run: make check $COVER_FLOOR
      - name: Versi app dan daemon sama
        if: runner.os == 'Linux'
        run: ./scripts/check-versions.sh
      - name: Pembuktian lapisan (dependensi terlarang membuat gerbang merah)
        if: runner.os == 'Linux'
        run: make red-check
      - name: Tipe protokol TypeScript sinkron
        if: runner.os == 'Linux'
        run: git diff --exit-code apps/desktop/src/lib/protocol

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '37 3 * * 1') && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Dependensi sistem Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      - name: Placeholder biner daemon (resource installer Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: printf 'placeholder\n' > apps/desktop/src-tauri/resources/mandord
      - run: bun run check
        working-directory: apps/desktop
      - run: bun run test
        working-directory: apps/desktop
      - run: bun run build
        working-directory: apps/desktop
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
