<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mandor · Lark login</title>
  <!-- Served by mandord on 127.0.0.1:<callback port> after the Lark OAuth redirect.
       Self-contained on purpose: no external fonts, scripts, images, or stylesheets.
       Query: ?status=ok | ?status=error&reason=denied|state|expired|exchange -->
  <style>
    :root { --bg: #12110e; --card: #1a1814; --fg: #d4c5a9; --muted: #988b74; --border: #3a3530; --mark: #c8a97e; --ok: #8fb07a; --fail: #e08a80; color-scheme: dark; }
    :root[data-theme="light"] { --bg: #f6f3ee; --card: #ffffff; --fg: #2a231a; --muted: #6b5f4b; --border: #ddd4c5; --mark: #7d5c2e; --ok: #3f6a2a; --fail: #b23a31; color-scheme: light; }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) { --bg: #f6f3ee; --card: #ffffff; --fg: #2a231a; --muted: #6b5f4b; --border: #ddd4c5; --mark: #7d5c2e; --ok: #3f6a2a; --fail: #b23a31; color-scheme: light; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font: 400 14px/1.55 "Space Grotesk", ui-sans-serif, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: 420px; max-width: 100%; padding: 28px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 22px; }
    .mark { width: 18px; height: 18px; display: grid; gap: 2px; align-content: center; }
    .mark i { display: block; height: 3px; border-radius: 1px; background: var(--mark); }
    .mark i:nth-child(2) { width: 70%; justify-self: end; }
    .mark i:nth-child(3) { width: 42%; }
    .status { display: flex; gap: 12px; align-items: flex-start; }
    .status svg { flex: none; width: 22px; height: 22px; margin-top: 2px; }
    h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
    p { margin: 6px 0 0; color: var(--muted); }
    code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .ok svg { color: var(--ok); } .fail svg { color: var(--fail); }
    .foot { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main role="main" aria-live="polite">
    <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Mandor</div>
    <div id="out"></div>
    <div class="foot">You can close this tab.</div>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      /* ?theme= is only for design previews; the real page follows the OS setting */
      if (q.get('theme')) document.documentElement.setAttribute('data-theme', q.get('theme'));
      var ok = q.get('status') !== 'error';
      var check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>';
      var cross = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>';
      var reasons = {
        denied: 'You declined access in Lark. Mandor needs permission to read Sprint Tasks and update Task Status.',
        state: 'This response does not match the login Mandor started (state mismatch), so it was ignored.',
        expired: 'The login took too long and expired.',
        exchange: 'Lark did not accept the authorization code. Check the App ID and App Secret in Mandor.'
      };
      var reason = reasons[q.get('reason')] || reasons.state;
      document.title = ok ? 'Mandor · Logged in to Lark' : 'Mandor · Lark login failed';
      document.getElementById('out').innerHTML = ok
        ? '<div class="status ok">' + check + '<div><h1>Logged in to Lark</h1><p>You can return to Mandor.</p></div></div>'
        : '<div class="status fail">' + cross + '<div><h1>Lark login failed</h1><p>' + reason + '</p><p>Go back to Mandor and press <b>Log in with Lark</b> again.</p></div></div>';
    })();
  </script>
</body>
</html>
