[package]
name = "mandor-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Adapter penyimpanan mandor (sqlx SQLite). Satu-satunya pengguna sqlx."

[dependencies]
mandor-domain.workspace = true
mandor-usecase.workspace = true
sqlx = { workspace = true, features = ["sqlite", "postgres", "runtime-tokio", "migrate", "macros"] }
secrecy.workspace = true
tokio = { workspace = true, features = ["time"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11", default-features = false }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tempfile.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
