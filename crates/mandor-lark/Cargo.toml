[package]
name = "mandor-lark"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Adapter Lark mandor: OAuth per user, Bitable, komentar record."

[dependencies]
mandor-domain.workspace = true
mandor-usecase.workspace = true
reqwest = { workspace = true, features = ["json", "query", "rustls"] }
tokio = { workspace = true, features = ["fs", "time", "sync"] }
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand = { workspace = true, features = ["std", "thread_rng"] }
sha2 = { version = "0.11", default-features = false }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time"] }
tempfile.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
