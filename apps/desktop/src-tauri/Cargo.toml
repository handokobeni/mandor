[package]
name = "mandor-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Client Tauri mandor: hanya UI dan jembatan ke daemon mandord."

# Workspace terpisah dari daemon agar dependensi Tauri tidak masuk gerbang deny daemon.
[workspace]

[lib]
name = "mandor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
tokio = { version = "1", default-features = false, features = ["process", "io-util", "net", "sync", "time", "rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
module_name_repetitions = "allow"

# Ukuran target/: lihat catatan di Cargo.toml root. Dependensi Tauri dan WebKit
# besar, jadi debug info dependensi dimatikan; kode kita cukup nomor baris.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
