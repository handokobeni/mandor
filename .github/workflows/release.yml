name: release
# Installer Windows dan paket Linux (app desktop), serta biner mandord untuk WSL.
# - Manual (Actions → release → Run workflow): hasil diunduh dari artifact run.
# - Tag `v*`: hasil dilampirkan ke GitHub Release tag itu.
# - PR yang mengubah workflow ini: build saja, untuk memastikan workflow jalan.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

# Action dikunci ke commit SHA: workflow ini menghasilkan installer dan biner
# yang dibagikan, jadi isi action tidak boleh berubah tanpa sepengetahuan kita.
permissions:
  contents: read

jobs:
  windows-app:
    name: installer Windows
    # Installer membawa biner daemon Linux (KTD-48 plan service OS).
    needs: [wsl-daemon]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Biner daemon untuk resource installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mandord-linux-x86_64
          path: apps/desktop/src-tauri/resources
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build installer NSIS
        run: bun run tauri build --bundles nsis
        working-directory: apps/desktop
      - name: Hash daemon tertanam di app sama dengan biner yang dibawa
        shell: pwsh
        working-directory: apps/desktop/src-tauri
        run: |
          $hash = (Get-FileHash resources/mandord -Algorithm SHA256).Hash.ToLower()
          $exe = Get-ChildItem target/release/*.exe | Where-Object { $_.Name -notlike '*setup*' } | Select-Object -First 1
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe.FullName))
          if (-not $text.Contains($hash)) { throw "hash $hash tidak tertanam di $($exe.Name)" }
          Write-Output "hash tertanam: $hash"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mandor-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  wsl-daemon:
    name: mandord untuk WSL (Linux x86_64)
    # Ubuntu 22.04: glibc lebih lama agar biner jalan di WSL Ubuntu 22.04 maupun 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked --bin mandord
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mandord-linux-x86_64
          path: target/release/mandord
          if-no-files-found: error

  linux-app:
    name: paket Linux
    # Paket membawa biner daemon Linux (KTD-L5 plan paket Linux). Ubuntu 22.04
    # agar glibc minimum sama dengan daemon.
    needs: [wsl-daemon]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Biner daemon untuk resource paket
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mandord-linux-x86_64
          path: apps/desktop/src-tauri/resources
      - name: Dependensi sistem Tauri dan bundler
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 rpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build paket deb, rpm, AppImage
        # linuxdeploy (AppImage) men-strip biner ELF di AppDir; daemon harus
        # identik dengan hash tertanam.
        env:
          NO_STRIP: "true"
        run: bun run tauri build --bundles deb,rpm,appimage
        working-directory: apps/desktop
      - name: Hash daemon tertanam di app dan ikut di setiap paket
        working-directory: apps/desktop/src-tauri
        run: |
          set -euo pipefail
          hash=$(sha256sum resources/mandord | cut -d' ' -f1)
          grep -qa "$hash" target/release/mandor-desktop || { echo "hash $hash tidak tertanam di app"; exit 1; }
          check() {
            local found
            found=$(find "$1" -type f -path '*resources/mandord' -print -quit)
            [ -n "$found" ] || { echo "mandord tidak ada di $2"; exit 1; }
            [ "$(sha256sum "$found" | cut -d' ' -f1)" = "$hash" ] || {
              echo "hash mandord di $2 berbeda: $found"
              ls -l resources/mandord "$found"; file resources/mandord "$found" || true
              readelf -d "$found" | grep -iE 'rpath|runpath' || true
              exit 1
            }
            echo "$2: mandord $hash"
          }
          x=$(mktemp -d)
          for f in target/release/bundle/deb/*.deb; do mkdir -p "$x/deb"; dpkg-deb -x "$f" "$x/deb"; check "$x/deb" "$(basename "$f")"; done
          # rpm: digest berkas dari header paket (tanpa mengekstrak payload).
          for f in target/release/bundle/rpm/*.rpm; do
            digest=$(rpm -qp --dump "$f" | awk '$1 ~ /resources\/mandord$/ {print $4}')
            [ "$digest" = "$hash" ] || { echo "hash mandord di $(basename "$f") berbeda: '$digest'"; rpm -qp --dump "$f" | grep mandord || true; exit 1; }
            echo "$(basename "$f"): mandord $digest"
          done
          for f in target/release/bundle/appimage/*.AppImage; do
            app=$(realpath "$f")
            (cd "$x" && "$app" --appimage-extract >/dev/null)
            check "$x/squashfs-root" "$(basename "$f")"
          done
      - name: SHA256SUMS
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: |
          mkdir -p ../../../linux-dist
          cp deb/*.deb rpm/*.rpm appimage/*.AppImage ../../../linux-dist/
          cd ../../../linux-dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mandor-linux-packages
          path: apps/desktop/src-tauri/linux-dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-app, linux-app, wsl-daemon]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - name: Lampirkan ke release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          chmod +x dist/mandord-linux-x86_64/mandord
          tar -C dist/mandord-linux-x86_64 -czf mandord-linux-x86_64.tar.gz mandord
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            dist/mandor-windows-installer/*.exe mandord-linux-x86_64.tar.gz \
            dist/mandor-linux-packages/*
