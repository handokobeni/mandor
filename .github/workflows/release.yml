name: release
# Installer Windows (app desktop) dan biner mandord untuk WSL.
# - Manual (Actions → release → Run workflow): hasil diunduh dari artifact run.
# - Tag `v*`: hasil dilampirkan ke GitHub Release tag itu.
# - PR yang mengubah workflow ini: build saja, untuk memastikan workflow jalan.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

# Action dikunci ke commit SHA: workflow ini menghasilkan installer dan biner
# yang dibagikan, jadi isi action tidak boleh berubah tanpa sepengetahuan kita.
permissions:
  contents: read

jobs:
  windows-app:
    name: installer Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build installer NSIS
        run: bun run tauri build --bundles nsis
        working-directory: apps/desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mandor-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  wsl-daemon:
    name: mandord untuk WSL (Linux x86_64)
    # Ubuntu 22.04: glibc lebih lama agar biner jalan di WSL Ubuntu 22.04 maupun 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked --bin mandord
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mandord-linux-x86_64
          path: target/release/mandord
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-app, wsl-daemon]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - name: Lampirkan ke release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          chmod +x dist/mandord-linux-x86_64/mandord
          tar -C dist/mandord-linux-x86_64 -czf mandord-linux-x86_64.tar.gz mandord
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            dist/mandor-windows-installer/*.exe mandord-linux-x86_64.tar.gz
