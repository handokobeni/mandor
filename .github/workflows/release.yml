name: release
# Installer Windows (app desktop) dan biner mandord untuk WSL.
# - Manual (Actions → release → Run workflow): hasil diunduh dari artifact run.
# - Tag `v*`: hasil dilampirkan ke GitHub Release tag itu.
# - PR yang mengubah workflow ini: build saja, untuk memastikan workflow jalan.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  windows-app:
    name: installer Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install --frozen-lockfile
        working-directory: apps/desktop
      - name: Build installer NSIS
        run: bun run tauri build --bundles nsis
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: mandor-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  wsl-daemon:
    name: mandord untuk WSL (Linux x86_64)
    # Ubuntu 22.04: glibc lebih lama agar biner jalan di WSL Ubuntu 22.04 maupun 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin mandord
      - uses: actions/upload-artifact@v4
        with:
          name: mandord-linux-x86_64
          path: target/release/mandord
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-app, wsl-daemon]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Lampirkan ke release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          chmod +x dist/mandord-linux-x86_64/mandord
          tar -C dist/mandord-linux-x86_64 -czf mandord-linux-x86_64.tar.gz mandord
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            dist/mandor-windows-installer/*.exe mandord-linux-x86_64.tar.gz
