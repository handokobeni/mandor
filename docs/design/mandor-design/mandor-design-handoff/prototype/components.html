<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Component sheet · Mandor</title>
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="css/mandor.css">
  <style>
    /* Sheet layout only. Every specimen uses the product classes from css/mandor.css. */
    .sheet-top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--background); }
    .sheet-top h1 { font-size: var(--text-md); font-weight: 600; }
    .sheet-top .muted { font-size: var(--text-sm); }
    .sheet-wrap { display: grid; grid-template-columns: 200px 1fr; align-items: start; }
    .sheet-nav { position: sticky; top: 49px; padding: 14px 8px; display: grid; gap: 1px; max-height: calc(100vh - 49px); overflow: auto; }
    .sheet-nav .grp { padding: 12px 8px 4px; }
    .sheet-nav a { height: 28px; font-size: var(--text-sm); }
    .panes { display: grid; gap: 0; min-width: 0; }
    .panes[data-mode="both"] { grid-template-columns: 1fr 1fr; }
    .pane { background: var(--background); color: var(--foreground); padding: 8px 24px 64px; min-width: 0; }
    .pane + .pane { border-left: 1px solid var(--border); }
    .pane { overflow-x: auto; }
    .spec-body > * { max-width: 100%; }
    .pane-label { position: sticky; top: 49px; z-index: 5; display: flex; align-items: center; gap: 6px; padding: 8px 0; background: var(--background); color: var(--muted-foreground); }
    .sec { padding-top: 28px; scroll-margin-top: 60px; }
    .sec > h2 { font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.01em; }
    .sec > p { color: var(--muted-foreground); margin-top: 4px; max-width: 70ch; }
    .specs { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; align-items: flex-start; }
    .spec { display: grid; gap: 8px; align-content: start; }
    .spec-body { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .spec-label { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted-foreground); }
    .spec.block { width: 100%; }
    .spec.card-w { width: 272px; }
    .tok-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: var(--text-sm); }
    .tok-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .tok-table .sw { width: 28px; height: 20px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .tok-table .val { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--muted-foreground); }
    .frame-box { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--background); }
  </style>
</head>
<body class="page-scroll" data-page="components">
  <header class="sheet-top" data-od-id="components-top">
    <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <h1>Mandor component sheet</h1>
    <span class="muted">shadcn components restyled with the Mandor theme, plus Mandor components. Layer names under each specimen.</span>
    <span style="flex:1"></span>
    <div class="toggle-group" role="group" aria-label="Theme preview">
      <button type="button" data-mode="dark" aria-pressed="true">Dark</button>
      <button type="button" data-mode="light" aria-pressed="false">Light</button>
      <button type="button" data-mode="both" aria-pressed="false">Side by side</button>
    </div>
    <a class="btn btn-ghost btn-sm" href="index.html">All screens</a>
  </header>
  <div class="sheet-wrap">
    <nav class="sheet-nav" id="sheet-nav" aria-label="Sections"></nav>
    <div class="panes" id="panes" data-mode="dark"></div>
  </div>

  <script src="vendor/lucide.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/components.js"></script>
  <script src="js/workspace-content.js"></script>
  <script src="js/ac-data.js"></script>
  <script src="js/ac.js"></script>
  <script src="js/components-sheet.js"></script>
</body>
</html>
